<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lady Liya</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:      #04040e;
  --panel:   #080818;
  --panel2:  #0c0c22;

  --cyan:    #00f5ff;
  --pink:    #ff2d78;
  --purple:  #b44dff;
  --gold:    #ffd700;
  --green:   #00ff99;
  --red:     #ff3355;

  --cyan-d:  rgba(0,245,255,0.08);
  --cyan-m:  rgba(0,245,255,0.35);
  --pink-d:  rgba(255,45,120,0.08);
  --pink-m:  rgba(255,45,120,0.35);
  --purple-d:rgba(180,77,255,0.08);

  --mono:    'Share Tech Mono', monospace;
  --display: 'Orbitron', monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: white;
  font-family: var(--mono);
  overflow: hidden;
}

/* ── Background: star field ── */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Scanlines ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px);
  pointer-events: none;
  z-index: 999;
}

/* ── Layout ── */
.shell {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

/* ── Card ── */
.card {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(0,245,255,0.12),
    0 0 60px rgba(0,245,255,0.06),
    0 0 120px rgba(255,45,120,0.04),
    0 32px 80px rgba(0,0,0,0.8);
}

/* Rainbow animated top border */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    var(--cyan), var(--purple), var(--pink),
    var(--gold), var(--green), var(--cyan));
  background-size: 300% 100%;
  animation: rainbowSlide 4s linear infinite;
  z-index: 5;
}

@keyframes rainbowSlide {
  from { background-position: 0% 0; }
  to   { background-position: 300% 0; }
}

/* Corner brackets */
.corner { position: absolute; width: 16px; height: 16px; z-index: 6; }
.corner-tl { top: 0; left: 0; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.corner-tr { top: 0; right: 0; border-top: 2px solid var(--pink); border-right: 2px solid var(--pink); }
.corner-bl { bottom: 0; left: 0; border-bottom: 2px solid var(--purple); border-left: 2px solid var(--purple); }
.corner-br { bottom: 0; right: 0; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }

/* ── Header ── */
.header {
  padding: 28px 28px 20px;
  text-align: center;
  background: linear-gradient(180deg, rgba(0,245,255,0.04) 0%, transparent 100%);
  border-bottom: 1px solid rgba(0,245,255,0.1);
  position: relative;
}

/* Radar ring — multicolour */
.radar-ring {
  position: relative;
  width: 84px; height: 84px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring-pulse {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid;
  border-color: var(--cyan);
  animation: ringExpand 2.8s ease-out infinite;
}
.ring-pulse:nth-child(2) {
  inset: 10px;
  border-color: var(--pink);
  animation-delay: 1.4s;
}

@keyframes ringExpand {
  0%   { transform: scale(0.7); opacity: 0.9; }
  100% { transform: scale(1.6); opacity: 0; }
}

.radar-core {
  width: 50px; height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,245,255,0.12) 0%, rgba(180,77,255,0.06) 100%);
  border: 1px solid var(--cyan-m);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
}

/* Sweep — goes cyan → pink over one rotation */
.radar-core::after {
  content: '';
  position: absolute;
  width: 50%;
  height: 1.5px;
  background: linear-gradient(90deg, var(--cyan), var(--pink));
  top: 50%; left: 50%;
  transform-origin: left center;
  animation: sweep 3s linear infinite;
  border-radius: 2px;
}

@keyframes sweep { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.radar-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: conic-gradient(var(--cyan), var(--pink), var(--purple), var(--cyan));
  box-shadow: 0 0 10px var(--cyan), 0 0 22px var(--pink);
  animation: dotSpin 3s linear infinite;
}
@keyframes dotSpin { to { filter: hue-rotate(360deg); } }

.logo {
  font-family: var(--display);
  font-size: 1.55rem;
  font-weight: 900;
  letter-spacing: 6px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(0,245,255,0.4));
  animation: logoHue 6s linear infinite;
}
@keyframes logoHue {
  0%,100% { filter: drop-shadow(0 0 20px rgba(0,245,255,0.5)); }
  33%      { filter: drop-shadow(0 0 20px rgba(180,77,255,0.5)); }
  66%      { filter: drop-shadow(0 0 20px rgba(255,45,120,0.5)); }
}

.tagline {
  font-size: 0.55rem;
  letter-spacing: 3px;
  color: rgba(0,245,255,0.35);
  margin-top: 5px;
}

/* ── Stats ── */
.stats-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid rgba(0,245,255,0.08);
}

.stat-cell {
  padding: 12px 8px;
  text-align: center;
  transition: background 0.3s;
}
.stat-cell + .stat-cell { border-left: 1px solid rgba(255,255,255,0.05); }
.stat-cell.flash { background: rgba(0,245,255,0.07); }

.stat-key {
  font-size: 0.48rem;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.stat-key.cyan   { color: rgba(0,245,255,0.45); }
.stat-key.pink   { color: rgba(255,45,120,0.45); }
.stat-key.purple { color: rgba(180,77,255,0.45); }

.stat-val {
  font-family: var(--display);
  font-size: 0.75rem;
  font-weight: 700;
}
.stat-val.cyan   { color: var(--cyan);   text-shadow: 0 0 12px rgba(0,245,255,0.5); }
.stat-val.pink   { color: var(--pink);   text-shadow: 0 0 12px rgba(255,45,120,0.5); }
.stat-val.purple { color: var(--purple); text-shadow: 0 0 12px rgba(180,77,255,0.5); }

.slot-bar { margin-top: 5px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.slot-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  background-size: 200% 100%;
  border-radius: 2px;
  width: 0%;
  transition: width 0.6s ease;
  animation: fillShimmer 3s linear infinite;
}
@keyframes fillShimmer {
  from { background-position: 0% 0; }
  to   { background-position: 200% 0; }
}

/* ── Body ── */
.body { padding: 20px; }

.field-label {
  font-size: 0.52rem;
  letter-spacing: 3px;
  color: rgba(0,245,255,0.4);
  margin-bottom: 6px;
}

.input-wrap { position: relative; margin-bottom: 12px; }
.input-prefix {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--cyan-m);
  pointer-events: none;
  font-size: 0.9rem;
}

input[type="text"] {
  width: 100%;
  padding: 12px 12px 12px 28px;
  background: var(--panel2);
  border: 1px solid rgba(0,245,255,0.15);
  border-radius: 4px;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 0.88rem;
  letter-spacing: 1px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]::placeholder { color: rgba(0,245,255,0.15); }
input[type="text"]:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px rgba(0,245,255,0.15), 0 0 20px rgba(0,245,255,0.06);
}

/* ── Button ── */
.btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 4px;
  font-family: var(--display);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 4px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  color: #fff;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
  background-size: 200% 100%;
  animation: btnGradient 4s linear infinite;
  transition: box-shadow 0.2s, transform 0.1s, opacity 0.2s;
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

@keyframes btnGradient {
  from { background-position: 0% 0; }
  to   { background-position: 200% 0; }
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}
.btn:hover::before { transform: translateX(100%); }
.btn:hover { box-shadow: 0 0 30px rgba(0,245,255,0.3), 0 0 60px rgba(255,45,120,0.15); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; animation: none; background: #333; }
.btn:disabled::before { display: none; }

.btn-spinner {
  display: none;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Code Box ── */
.code-box {
  display: none;
  margin-top: 16px;
  padding: 20px;
  border-radius: 4px;
  text-align: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(0,245,255,0.05), rgba(180,77,255,0.05), rgba(255,45,120,0.05));
  border: 1px solid rgba(180,77,255,0.3);
  animation: fadeUp 0.4s ease;
}

/* Animated border glow */
.code-box::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink), var(--cyan));
  background-size: 300% 100%;
  animation: rainbowSlide 3s linear infinite;
  z-index: -1;
  opacity: 0.5;
}

@keyframes fadeUp {
  from { opacity:0; transform: translateY(-8px); }
  to   { opacity:1; transform: translateY(0); }
}

.code-label {
  font-size: 0.52rem;
  letter-spacing: 4px;
  color: rgba(180,77,255,0.6);
  margin-bottom: 12px;
}

.code {
  font-family: var(--display);
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: 8px;
  color: var(--cyan);
  text-shadow:
    0 0 20px rgba(0,245,255,0.9),
    0 0 50px rgba(180,77,255,0.5),
    0 0 90px rgba(255,45,120,0.3);
  animation: codeShimmer 2s ease-in-out infinite;
}

@keyframes codeShimmer {
  0%,100% { filter: drop-shadow(0 0 15px rgba(0,245,255,0.5)); }
  50%      { filter: drop-shadow(0 0 30px rgba(255,45,120,0.7)); }
}

.code-hint {
  font-size: 0.58rem;
  color: rgba(180,77,255,0.45);
  margin-top: 10px;
  letter-spacing: 1px;
  line-height: 1.7;
}

/* ── Status ── */
.status-row {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 30px;
}

.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  flex-shrink: 0;
  animation: dotBlink 2s ease-in-out infinite;
}
@keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.status-dot.ok  { background: var(--green);  box-shadow: 0 0 8px var(--green);  animation: none; }
.status-dot.err { background: var(--red);    box-shadow: 0 0 8px var(--red);    animation: none; }

#status {
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: rgba(0,245,255,0.45);
  line-height: 1.4;
}
#status.ok  { color: var(--green); }
#status.err { color: var(--red); }

/* ── Sessions ── */
.sessions-section {
  margin-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding-top: 14px;
}

.sessions-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.sessions-title {
  font-size: 0.52rem;
  letter-spacing: 3px;
  color: rgba(255,45,120,0.45);
}

.sessions-count {
  font-family: var(--display);
  font-size: 0.6rem;
  color: var(--pink);
  background: rgba(255,45,120,0.08);
  border: 1px solid rgba(255,45,120,0.25);
  padding: 2px 8px;
  border-radius: 2px;
}

.session-list {
  list-style: none;
  max-height: 100px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,245,255,0.15) transparent;
}
.session-list::-webkit-scrollbar { width: 3px; }
.session-list::-webkit-scrollbar-thumb { background: rgba(0,245,255,0.15); border-radius: 2px; }

.session-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: linear-gradient(90deg, rgba(0,245,255,0.04), rgba(180,77,255,0.04));
  border: 1px solid rgba(0,245,255,0.1);
  border-radius: 3px;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.7);
  animation: fadeUp 0.3s ease;
}

.session-pip {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: conic-gradient(var(--cyan), var(--pink), var(--cyan));
  box-shadow: 0 0 6px var(--cyan);
  flex-shrink: 0;
  animation: dotSpin 3s linear infinite;
}

.session-empty {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.1);
  text-align: center;
  letter-spacing: 2px;
  padding: 12px 0;
}

/* ── Footer ── */
.footer {
  padding: 8px 20px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.2);
}
.footer-tag { font-size: 0.48rem; letter-spacing: 2px; color: rgba(0,245,255,0.18); }
.footer-ver { font-size: 0.48rem; color: rgba(255,45,120,0.18); }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="shell">
<div class="card">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="header">
    <div class="radar-ring">
      <div class="ring-pulse"></div>
      <div class="ring-pulse"></div>
      <div class="radar-core">
        <div class="radar-dot"></div>
      </div>
    </div>
    <div class="logo">LADY LIYA</div>
    <div class="tagline">WHATSAPP PAIRING CONTROL SYSTEM</div>
  </div>

  <div class="stats-bar">
    <div class="stat-cell" id="cell-slots">
      <div class="stat-key cyan">SLOTS</div>
      <div class="stat-val cyan" id="slots">0/50</div>
      <div class="slot-bar"><div class="slot-fill" id="slotFill"></div></div>
    </div>
    <div class="stat-cell" id="cell-uptime">
      <div class="stat-key pink">UPTIME</div>
      <div class="stat-val pink" id="uptime">0h 0m 0s</div>
    </div>
    <div class="stat-cell" id="cell-active">
      <div class="stat-key purple">ACTIVE</div>
      <div class="stat-val purple" id="active">0</div>
    </div>
  </div>

  <div class="body">
    <div class="field-label">TARGET NUMBER</div>
    <div class="input-wrap">
      <span class="input-prefix">›</span>
      <input type="text" id="phoneInput" placeholder="2348012345678" autocomplete="off" spellcheck="false"/>
    </div>

    <button class="btn" id="connectBtn">
      <span id="btnText">GENERATE PAIR</span>
      <div class="btn-spinner" id="btnSpinner"></div>
    </button>

    <div class="code-box" id="codeBox">
      <div class="code-label">── PAIRING CODE ──</div>
      <div class="code" id="codeDisplay">--------</div>
      <div class="code-hint">WhatsApp → Settings → Linked Devices<br>→ Link a Device → Enter code above</div>
    </div>

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <div id="status">Awaiting input...</div>
    </div>

    <div class="sessions-section">
      <div class="sessions-header">
        <span class="sessions-title">ACTIVE SESSIONS</span>
        <span class="sessions-count" id="sessCount">0</span>
      </div>
      <ul class="session-list" id="sessionList">
        <li class="session-empty">NO ACTIVE SESSIONS</li>
      </ul>
    </div>
  </div>

  <div class="footer">
    <span class="footer-tag">LADY LIYA SYSTEM</span>
    <span class="footer-ver">v3.1.0</span>
  </div>
</div>
</div>

<script>
/* ── Multicolour star particles ── */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

const COLORS = ['rgba(0,245,255,A)', 'rgba(255,45,120,A)', 'rgba(180,77,255,A)', 'rgba(255,215,0,A)', 'rgba(0,255,153,A)'];

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

const particles = Array.from({length: 80}, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: Math.random() * 1.5 + 0.2,
  vx: (Math.random() - 0.5) * 0.25,
  vy: (Math.random() - 0.5) * 0.25,
  a: Math.random() * 0.5 + 0.1,
  color: COLORS[Math.floor(Math.random() * COLORS.length)],
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color.replace('A', p.a);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();

/* ── Code scramble ── */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function scramble(el, final, ms = 900) {
  let start = null;
  const len = final.length;
  function step(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / ms, 1);
    const revealed = Math.floor(p * len);
    let out = '';
    for (let i = 0; i < len; i++) {
      if (i < revealed || final[i] === '-') out += final[i];
      else out += CHARS[Math.floor(Math.random() * CHARS.length)];
    }
    el.textContent = out;
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = final;
  }
  requestAnimationFrame(step);
}

function flash(id) {
  const el = document.getElementById(id);
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 400);
}

function setStatus(text, type = '') {
  document.getElementById('status').textContent = text;
  document.getElementById('status').className = type;
  document.getElementById('statusDot').className = 'status-dot ' + type;
}

function setBtnLoading(on) {
  document.getElementById('connectBtn').disabled = on;
  document.getElementById('btnText').style.display = on ? 'none' : 'block';
  document.getElementById('btnSpinner').style.display = on ? 'block' : 'none';
}

/* ── Socket ── */
const socket = io();
const connectBtn  = document.getElementById('connectBtn');
const phoneInput  = document.getElementById('phoneInput');
const codeBox     = document.getElementById('codeBox');
const codeDisplay = document.getElementById('codeDisplay');

connectBtn.addEventListener('click', () => {
  const num = phoneInput.value.trim();
  if (!num) { setStatus('Enter a target number first', 'err'); return; }
  setBtnLoading(true);
  setStatus('Requesting pairing code...', '');
  socket.emit('request-code', num);
});

phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') connectBtn.click(); });

socket.on('pairing-code', code => {
  setBtnLoading(false);
  codeBox.style.display = 'block';
  // Small delay so display:block renders before we write textContent
  setTimeout(() => {
    scramble(codeDisplay, code);
  }, 50);
  setStatus('Code ready — enter in WhatsApp Linked Devices', '');
});

socket.on('connected', () => {
  setBtnLoading(false);
  codeBox.style.display = 'none';
  phoneInput.value = '';
  setStatus('✔ WhatsApp linked successfully', 'ok');
});

socket.on('error', msg => {
  setBtnLoading(false);
  setStatus(msg || 'Connection failed — retry', 'err');
});

socket.on('logged-out', () => {
  setBtnLoading(false);
  setStatus('Session ended — refresh to reconnect', 'err');
});

socket.on('stats', data => {
  const active = data.active ?? 0;
  const max = data.max ?? 50;
  document.getElementById('slots').textContent = `${active}/${max}`;
  document.getElementById('active').textContent = active;
  document.getElementById('uptime').textContent = fmt(data.uptime ?? 0);
  document.getElementById('sessCount').textContent = active;
  document.getElementById('slotFill').style.width = `${Math.min((active/max)*100,100)}%`;
  flash('cell-slots'); flash('cell-active');

  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  const sessions = data.sessions ?? [];
  if (!sessions.length) {
    list.innerHTML = '<li class="session-empty">NO ACTIVE SESSIONS</li>';
  } else {
    sessions.forEach(num => {
      const li = document.createElement('li');
      li.className = 'session-item';
      li.innerHTML = `<span class="session-pip"></span>${num}`;
      list.appendChild(li);
    });
  }
});

function fmt(s) {
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${Math.floor(s%60)}s`;
}
</script>
</body>
</html>
