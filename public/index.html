<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lady Liya</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* container */
.container {
    width: 320px;
    background: #12121a;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #ff660033;
    text-align: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #ff6600;
}

.tagline {
    font-size: 10px;
    color: #aaa;
    margin-bottom: 15px;
}

/* stats */
.stats {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    margin-bottom: 20px;
    color: #ff6600cc;
}

/* input */
input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
    outline: none;
}

button {
    width: 100%;
    padding: 10px;
    border: none;
    background: #ff6600;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* code box */
.code-box {
    display: none;
    margin-top: 15px;
    padding: 10px;
    background: #1b1b25;
    border-radius: 10px;
}

.code {
    font-size: 20px;
    color: #00ff99;
    margin-top: 5px;
}

/* status */
.status {
    margin-top: 10px;
    font-size: 12px;
    color: #aaa;
}

/* sessions */
.sessions {
    margin-top: 20px;
    text-align: left;
    font-size: 0.8rem;
    max-height: 120px;
    overflow-y: auto;
    border-top: 1px solid #ff660033;
    padding-top: 10px;
}

.sessions ul {
    list-style: none;
    padding: 0;
}

.sessions li {
    padding: 3px 0;
    color: #ffcc88;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">LADY LIYA</div>
    <div class="tagline">WHATSAPP PAIRING CONTROL SYSTEM</div>

    <div class="stats">
        <div>🟢 Slots: <span id="slots">0/50</span></div>
        <div>⏱ Uptime: <span id="uptime">0s</span></div>
        <div>📡 Active: <span id="active">0</span></div>
    </div>

    <input type="text" id="phoneInput" placeholder="2348012345678" />
    <button id="connectBtn">GENERATE PAIR</button>

    <div class="code-box" id="codeBox">
        <div>PAIRING CODE</div>
        <div class="code" id="codeDisplay">--------</div>
    </div>

    <div class="status" id="status">Waiting...</div>

    <div class="sessions">
        <h3>Active Sessions</h3>
        <ul id="sessionList"></ul>
    </div>
</div>

<script>
const socket = io();

const connectBtn = document.getElementById("connectBtn");
const phoneInput = document.getElementById("phoneInput");
const codeBox = document.getElementById("codeBox");
const codeDisplay = document.getElementById("codeDisplay");
const status = document.getElementById("status");

socket.on("connect", () => {
    console.log("Connected to Lady Liya server");
});

connectBtn.addEventListener("click", () => {
    const phoneNumber = phoneInput.value.trim();
    socket.emit("request-code", phoneNumber);
});

socket.on("pairing-code", (code) => {
    codeBox.style.display = "block";
    codeDisplay.textContent = code;
});

socket.on("connected", () => {
    status.textContent = "Connected ✔";
});

socket.on("stats", (data) => {
    document.getElementById("slots").textContent =
        `${data.active}/${data.max}`;

    document.getElementById("active").textContent =
        data.active;

    document.getElementById("uptime").textContent =
        formatTime(data.uptime);

    const list = document.getElementById("sessionList");
    list.innerHTML = "";

    data.sessions.forEach(num => {
        const li = document.createElement("li");
        li.textContent = `📱 ${num}`;
        list.appendChild(li);
    });
});

function formatTime(seconds) {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = Math.floor(seconds % 60);
    return `${h}h ${m}m ${s}s`;
}
</script>

</body>
</html>
